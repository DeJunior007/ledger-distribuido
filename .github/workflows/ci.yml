name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run check:compliance
      - run: bun run format:check

  unit:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  compliance:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check:compliance
      - run: bun test --preload ./test/support/preload.ts --timeout 180000 --reporter=junit --reporter-outfile=compliance.xml test/compliance
      - if: always()
        run: bun scripts/compliance/report.ts
      - if: always()
        run: docker ps -aq --filter label=org.testcontainers=true | xargs -r docker rm -f

  integration:
    needs: compliance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:integration
      - if: always()
        run: docker ps -aq --filter label=org.testcontainers=true | xargs -r docker rm -f

  concurrency:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:concurrency
      - if: always()
        run: docker ps -aq --filter label=org.testcontainers=true | xargs -r docker rm -f

  e2e:
    needs: concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: bun run test:e2e
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
