events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream api_upstream {
    zone api_upstream 64k;
    server api:3000 resolve max_fails=3 fail_timeout=10s;
  }
  server {
    listen 80;
    client_max_body_size 16k;
    error_page 413 @problem_413;
    error_page 502 @problem_502;
    error_page 503 @problem_503;
    error_page 504 @problem_504;
    location / {
      proxy_pass http://api_upstream;
      proxy_next_upstream error timeout;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }
    location @problem_413 {
      default_type application/problem+json;
      return 413 '{"type":"urn:jungle:problem:INVALID_PAYLOAD","title":"Invalid payload","status":413,"detail":"The request is invalid","failureCode":"INVALID_PAYLOAD","retryable":false,"action":"FIX_PAYLOAD"}';
    }
    location @problem_502 {
      default_type application/problem+json;
      add_header Retry-After 5 always;
      return 502 '{"type":"urn:jungle:problem:INFRASTRUCTURE_UNAVAILABLE","title":"Infrastructure unavailable","status":502,"detail":"A dependency is temporarily unavailable; retry later","failureCode":"INFRASTRUCTURE_UNAVAILABLE","retryable":true,"action":"RETRY"}';
    }
    location @problem_503 {
      default_type application/problem+json;
      add_header Retry-After 5 always;
      return 503 '{"type":"urn:jungle:problem:INFRASTRUCTURE_UNAVAILABLE","title":"Infrastructure unavailable","status":503,"detail":"A dependency is temporarily unavailable; retry later","failureCode":"INFRASTRUCTURE_UNAVAILABLE","retryable":true,"action":"RETRY"}';
    }
    location @problem_504 {
      default_type application/problem+json;
      add_header Retry-After 5 always;
      return 504 '{"type":"urn:jungle:problem:INFRASTRUCTURE_UNAVAILABLE","title":"Infrastructure unavailable","status":504,"detail":"A dependency is temporarily unavailable; retry later","failureCode":"INFRASTRUCTURE_UNAVAILABLE","retryable":true,"action":"RETRY"}';
    }
  }
}
